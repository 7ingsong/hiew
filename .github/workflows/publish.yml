# Build on every push / PR; publish to PyPI when a tag v<version> is pushed.
# Release: bump __version__ in hiew/__init__.py, commit, then
#   git tag v1.0.2 && git push origin v1.0.2
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/python -c "import hiew, hiew.app; print(hiew.__version__)"
      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(/tmp/v/bin/python -c "import hiew; print(hiew.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hiew/
    permissions:
      id-token: write   # trusted publishing, no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
